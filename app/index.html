<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Killer Sudoku</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f6fb;
        --fg: #1d1b26;
        --muted: #5d5a6b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #15141b;
          --fg: #ecebf3;
          --muted: #a9a6b8;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, system-ui, sans-serif;
        text-align: center;
      }
      p {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title"></h1>
      <p id="subtitle"></p>
      <p id="engine"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
